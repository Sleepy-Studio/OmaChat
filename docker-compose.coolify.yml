# Coolify Git-based Docker Compose application for the OmaChat server.
# Set Base Directory to / and Docker Compose Location to /docker-compose.coolify.yml.
# The image is built and published to GHCR by .github/workflows/docker.yml;
# Coolify pulls it rather than building source code.
#
# OmaChat serves its own TLS over TCP and media over UDP. Neither protocol
# belongs behind Coolify's HTTP proxy, so expose both ports directly. Coolify
# generates the hostname below from its server wildcard domain (or sslip.io).
# Its HTTP proxy route is unused: clients connect to that hostname on TCP 6473.
services:
  omachat-server:
    image: ghcr.io/sleepy-studio/omachat-server:${OMACHAT_IMAGE_TAG:-latest}
    restart: unless-stopped

    # Use the same host:container form as Coolify's own Compose examples.
    # These are direct host ports; the generated HTTP domain does not carry
    # OmaChat's TLS control connection or UDP media.
    ports:
      - "${OMACHAT_PORT:-6473}:${OMACHAT_PORT:-6473}/tcp"
      - "${OMACHAT_MEDIA_PORT:-6474}:${OMACHAT_MEDIA_PORT:-6474}/udp"

    # Coolify discovers this Compose-owned persistent volume. It contains the
    # SQLite database, attachments, generated config and TLS identity.
    volumes:
      - omachat-data:/var/lib/omachat

    # Coolify generates the FQDN for this Compose service and supplies it to
    # the image for the first-run self-signed certificate. The service name
    # omachat-server becomes OMACHAT_SERVER in the magic variable.
    environment:
      OMACHAT_HOSTNAME: ${SERVICE_FQDN_OMACHAT_SERVER}
      OMACHAT_NAME: ${OMACHAT_NAME:-OmaChat}
      OMACHAT_PORT: ${OMACHAT_PORT:-6473}
      OMACHAT_MEDIA_PORT: ${OMACHAT_MEDIA_PORT:-6474}
      OMACHAT_REGISTRATION_OPEN: ${OMACHAT_REGISTRATION_OPEN:-true}
      OMACHAT_NODE_ID: ${OMACHAT_NODE_ID:-1}
      OMACHAT_MAX_UPLOAD_MB: ${OMACHAT_MAX_UPLOAD_MB:-50}
      OMACHAT_LOG_LEVEL: ${OMACHAT_LOG_LEVEL:-info}

      # Optional: "sign in with Discord/GitHub/Google". Leave a provider's
      # id/secret unset in Coolify's environment variables to keep it
      # disabled; only supplying both enables it. Register the app as an
      # "installed app"/"loopback redirect" type on the provider's side —
      # see docs/self-hosting.md. Mark the *_SECRET variables as Coolify
      # secrets rather than plain env vars.
      OMACHAT_OAUTH_DISCORD_CLIENT_ID: ${OMACHAT_OAUTH_DISCORD_CLIENT_ID:-}
      OMACHAT_OAUTH_DISCORD_CLIENT_SECRET: ${OMACHAT_OAUTH_DISCORD_CLIENT_SECRET:-}
      OMACHAT_OAUTH_GITHUB_CLIENT_ID: ${OMACHAT_OAUTH_GITHUB_CLIENT_ID:-}
      OMACHAT_OAUTH_GITHUB_CLIENT_SECRET: ${OMACHAT_OAUTH_GITHUB_CLIENT_SECRET:-}
      OMACHAT_OAUTH_GOOGLE_CLIENT_ID: ${OMACHAT_OAUTH_GOOGLE_CLIENT_ID:-}
      OMACHAT_OAUTH_GOOGLE_CLIENT_SECRET: ${OMACHAT_OAUTH_GOOGLE_CLIENT_SECRET:-}

    # No HTTP health endpoint exists. Bash is present in the published image.
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/${OMACHAT_PORT:-6473}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  omachat-data:
