// OmaChat reliable control protocol (TCP + TLS 1.3).
//
// Framing: every frame is a 4-byte big-endian unsigned length followed by
// exactly that many bytes of a serialized `Envelope`. Frames larger than
// kMaxFrameBytes (see shared/src/protocol/Framing.hpp) terminate the
// connection. See docs/protocol.md for the full specification.

syntax = "proto3";

package omachat.proto;

option optimize_for = LITE_RUNTIME;

// ---------------------------------------------------------------- entities

enum UserStatus {
  USER_STATUS_OFFLINE = 0;
  USER_STATUS_ONLINE = 1;
  USER_STATUS_IDLE = 2;
  USER_STATUS_DO_NOT_DISTURB = 3;
}

message User {
  uint64 id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  UserStatus status = 5;
  string bio = 6;
}

message UpdateProfileRequest {
  string display_name = 1;
  string avatar_url = 2;
  string bio = 3;
}

message Server {
  uint64 id = 1;
  string name = 2;
  string icon_url = 3;
  uint64 owner_id = 4;
  string description = 5;            // longer server details, empty by default
  uint64 icon_attachment_id = 6;
  uint64 banner_attachment_id = 7;
}

enum ChannelType {
  CHANNEL_TYPE_TEXT = 0;
  CHANNEL_TYPE_VOICE = 1;
  CHANNEL_TYPE_CATEGORY = 2;
  CHANNEL_TYPE_DM = 3;
  CHANNEL_TYPE_GROUP_DM = 4;
}

message Channel {
  uint64 id = 1;
  uint64 server_id = 2;      // 0 for DM / GROUP_DM
  string name = 3;
  ChannelType type = 4;
  uint64 parent_id = 5;      // category id, 0 when top-level
  uint32 position = 6;
  string topic = 7;
  repeated uint64 recipient_ids = 8;  // DM participants
  uint64 effective_permissions = 9;   // for the receiving user only
  string description = 10;             // longer channel details, empty by default
  uint64 icon_attachment_id = 11;
  uint64 banner_attachment_id = 12;
}

message Role {
  uint64 id = 1;
  uint64 server_id = 2;
  string name = 3;
  uint64 permissions = 4;
  uint32 position = 5;      // higher outranks lower
  uint32 color = 6;         // 0xRRGGBB, 0 = default
  bool is_default = 7;      // implicitly held by every member
}

message Member {
  uint64 server_id = 1;
  uint64 user_id = 2;
  repeated uint64 role_ids = 3;
  int64 joined_at = 4;      // unix ms
}

message Attachment {
  uint64 id = 1;
  string filename = 2;
  string mime_type = 3;
  uint64 size = 4;
  bytes sha256 = 5;          // digest of the stored bytes
}

message Reaction {
  string emoji = 1;
  uint32 count = 2;
  bool me = 3;
}

// A server's custom emoji. `emoji` fields elsewhere (Reaction.emoji,
// ReactionRequest.emoji, ReactionEvent.emoji) reference these by
// ":name:" instead of a Unicode glyph; the client resolves the name against
// the server's synced CustomEmoji list to render the image.
message CustomEmoji {
  uint64 id = 1;
  uint64 server_id = 2;
  string name = 3;
  uint64 attachment_id = 4;
  uint64 uploader_id = 5;
  int64 created_at = 6;
}

message ChatMessage {
  uint64 id = 1;
  uint64 channel_id = 2;
  uint64 author_id = 3;
  int64 timestamp = 4;       // unix ms
  string content = 5;
  uint64 reply_to = 6;
  int64 edited_at = 7;       // unix ms, 0 = never
  repeated uint64 mention_ids = 8;
  repeated Attachment attachments = 9;
  repeated Reaction reactions = 10;
  bool is_action = 11;       // "/me" message
  bytes encrypted = 12;      // E2EPayload (direct/group conversations); content is empty
}

message VoiceState {
  uint64 user_id = 1;
  uint64 channel_id = 2;     // 0 = not in voice
  bool self_mute = 3;
  bool self_deaf = 4;
  bool server_mute = 5;
  bool server_deaf = 6;
  uint32 stream_id = 7;      // media stream id for speaking indicators
  bool streaming = 8;        // sharing their screen (1.2, "video.h264")
  uint64 owner_session_id = 9; // voice.ownership.v1; 0 on legacy servers
}

message Invite {
  string token = 1;
  uint64 server_id = 2;
  int64 expires_at = 3;      // unix ms, 0 = never
  uint32 max_uses = 4;       // 0 = unlimited
  uint32 uses = 5;
  string server_name = 6;
}

message PermissionOverride {
  uint64 channel_id = 1;
  enum TargetType {
    TARGET_ROLE = 0;
    TARGET_USER = 1;
  }
  TargetType target_type = 2;
  uint64 target_id = 3;
  uint64 allow = 4;
  uint64 deny = 5;
}

// ------------------------------------------------------------------ errors

enum ErrorCode {
  ERROR_NONE = 0;
  ERROR_INTERNAL = 1;
  ERROR_BAD_REQUEST = 2;
  ERROR_PROTOCOL_MISMATCH = 3;
  ERROR_AUTHENTICATION = 4;       // bad credentials / expired token
  ERROR_NOT_AUTHENTICATED = 5;
  ERROR_PERMISSION_DENIED = 6;
  ERROR_NOT_FOUND = 7;
  ERROR_CONFLICT = 8;             // e.g. username taken
  ERROR_RATE_LIMITED = 9;
  ERROR_BANNED = 10;
  ERROR_INVITE_INVALID = 11;
  ERROR_RESUME_FAILED = 12;
  ERROR_REGISTRATION_CLOSED = 13;
  ERROR_TOO_LARGE = 14;           // attachment over the server's limit
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  uint32 retry_after_ms = 3;
}

// -------------------------------------------------------------- handshake

message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string client_version = 3;
  repeated string capabilities = 4;
}

enum OAuthProvider {
  OAUTH_PROVIDER_UNSPECIFIED = 0;
  OAUTH_PROVIDER_DISCORD = 1;
  OAUTH_PROVIDER_GITHUB = 2;
  OAUTH_PROVIDER_GOOGLE = 3;
}

// Advertised in HelloReply for each provider the server has credentials
// configured for, so clients never have to hardcode authorize endpoints
// or client ids.
message OAuthProviderConfig {
  OAuthProvider provider = 1;
  string client_id = 2;
  string authorize_url = 3;
  string scope = 4;
}

message HelloReply {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string server_version = 3;
  repeated string capabilities = 4;
  string instance_name = 5;
  bool registration_open = 6;
  uint32 media_udp_port = 7;
  uint64 max_upload_bytes = 8;   // 0 = attachments unsupported
  repeated OAuthProviderConfig oauth_providers = 9;
  string instance_id = 10; // instance.identity.v1: persistent server database UUID
}

// ---------------------------------------------------------- authentication

message RegisterRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message ResumeRequest {
  string access_token = 1;
  uint64 session_id = 2;
  uint64 last_sequence = 3;
}

// PKCE authorization-code login. The client (via a loopback redirect on the
// user's own machine) is the only party that ever sees `code`; the server
// exchanges it directly with the provider's token endpoint using its own
// client secret. If no account is linked to the provider identity yet, one
// is created from the provider profile (username derived from it, no
// password set).
message OAuthLoginRequest {
  OAuthProvider provider = 1;
  string code = 2;
  string code_verifier = 3;
  string redirect_uri = 4;
}

// Same PKCE exchange as OAuthLoginRequest, but for an already-authenticated
// session: attaches the resulting provider identity to the caller's account
// instead of logging in as whoever it belongs to. ERROR_CONFLICT if that
// identity is already linked to a different account.
message OAuthLinkRequest {
  OAuthProvider provider = 1;
  string code = 2;
  string code_verifier = 3;
  string redirect_uri = 4;
}

// ERROR_BAD_REQUEST if this would leave the account with no way to sign in
// (no password set and no other linked provider).
message OAuthUnlinkRequest {
  OAuthProvider provider = 1;
}

message ListOAuthIdentitiesRequest {}

message OAuthIdentity {
  OAuthProvider provider = 1;
  string provider_username = 2;
  int64 linked_at = 3;      // unix ms
}

message OAuthIdentityList {
  repeated OAuthIdentity identities = 1;
}

// sessions.manage.v1; never exposes credentials, digests or peer addresses.
message ListLoginSessionsRequest {
  uint64 before_id = 1; // exclusive descending-ID cursor; 0 starts at newest
}
message LoginSession {
  uint64 id = 1;
  int64 created_at = 2; // unix ms
  int64 expires_at = 3; // refresh expiry, unix ms
  bool connected = 4;
  bool current = 5;
}
message LoginSessionList {
  repeated LoginSession sessions = 1; // at most 100
  uint64 next_before_id = 2; // 0 when exhausted
}
message RevokeLoginSessionRequest { uint64 session_id = 1; }

message LogoutRequest {}
message DeleteAccountRequest {}

message AuthResult {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;       // only present after login/register/refresh rotation
  uint64 session_id = 4;
  int64 access_expires_at = 5;    // unix ms
}

message ResumeResult {
  uint64 replayed_events = 1;
}

// ------------------------------------------------------------- state sync

message SyncRequest {}
// Instance operator access is assigned locally in server.toml, never by a client.
message InstanceStatusRequest {}
message InstanceCommunity {
  uint64 id = 1;
  string name = 2;
  uint64 owner_id = 3;
  string owner_name = 4;
  uint32 members = 5;
  uint32 channels = 6;
  repeated uint64 member_ids = 7;
  repeated uint64 banned_user_ids = 8;
}
message InstanceUser {
  uint64 id = 1;
  string username = 2;
  string display_name = 3;
  bool online = 4;
  bool suspended = 5;
}
message InstanceAuditEntry {
  int64 at = 1;
  uint64 actor_id = 2;
  string action = 3;
  uint64 target_id = 4;
}
message InstanceStatus {
  string instance_name = 1;
  string server_version = 2;
  int64 started_at = 3;
  bool registration_open = 4;
  uint32 connected_sessions = 5;
  uint32 online_users = 6;
  uint32 total_users = 7;
  uint64 total_messages = 8;
  repeated InstanceCommunity communities = 9;
  repeated InstanceUser users = 10;
  repeated InstanceAuditEntry audit = 11;
  bool restart_available = 12;
  repeated string log_lines = 13;
}
message SetInstanceRegistrationRequest { bool open = 1; }
message DeleteInstanceCommunityRequest { uint64 server_id = 1; }
message SetInstanceSuspensionRequest { uint64 user_id = 1; bool suspended = 2; }
message RestartInstanceRequest {}
message InstanceModerationRequest {
  enum Action { KICK = 0; BAN = 1; UNBAN = 2; }
  uint64 server_id = 1;
  uint64 user_id = 2;
  Action action = 3;
}

message SyncState {
  User self = 1;
  repeated Server servers = 2;
  repeated Channel channels = 3;
  repeated Role roles = 4;
  repeated Member members = 5;
  repeated User users = 6;
  repeated VoiceState voice_states = 7;
  uint64 last_sequence = 8;
  repeated uint64 server_permissions_server_ids = 9;
  repeated uint64 server_permissions = 10;  // parallel to the field above
  repeated CustomEmoji emoji = 11;
  repeated ReadMarker read_markers = 12;
}

// --------------------------------------------------------- server/guilds

message CreateServerRequest {
  string name = 1;
  string description = 2;
}
message UpdateServerRequest {
  uint64 server_id = 1;
  string name = 2;             // empty = unchanged
  string description = 3;
  bool set_description = 4;
  uint64 icon_attachment_id = 5;     // 0 clears
  bool set_icon = 6;
  uint64 banner_attachment_id = 7;   // 0 clears
  bool set_banner = 8;
}
// Owner-only, repeat-safe import from DiscordChatExporter JSON. One request
// carries one bounded batch so even a large channel stays below frame limits.
message DiscordImportAsset {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
}
message DiscordImportPerson { string id = 1; string name = 2; }
message DiscordImportReaction {
  string emoji = 1;
  repeated DiscordImportPerson users = 2;
}
message DiscordImportMessage {
  string discord_id = 1;
  string author_id = 2;
  string author_name = 3;
  int64 timestamp = 4;
  int64 edited_at = 5;
  string content = 6;
  string reply_discord_id = 7;
  repeated DiscordImportAsset assets = 8;
  repeated DiscordImportPerson mentions = 9;
  repeated DiscordImportReaction reactions = 10;
}
message ImportDiscordBatchRequest {
  uint64 server_id = 1;
  string guild_id = 2;
  string channel_id = 3;
  string channel_name = 4;
  string channel_topic = 5;
  string category_id = 6;
  string category_name = 7;
  repeated DiscordImportMessage messages = 8;
}
message ImportDiscordBatchResult {
  uint64 channel_id = 1;
  uint32 imported = 2;
}
message LeaveServerRequest { uint64 server_id = 1; }
message DeleteServerRequest { uint64 server_id = 1; }
message CreateInviteRequest {
  uint64 server_id = 1;
  uint32 max_uses = 2;
  uint32 expires_in_seconds = 3;
}
message JoinInviteRequest { string token = 1; }
message ListInvitesRequest { uint64 server_id = 1; }
message InviteList { repeated Invite invites = 1; }

message CreateChannelRequest {
  uint64 server_id = 1;
  string name = 2;
  ChannelType type = 3;
  uint64 parent_id = 4;
  string topic = 5;
  string description = 6;
}
message UpdateChannelRequest {
  uint64 channel_id = 1;
  string name = 2;           // empty = unchanged
  string topic = 3;
  bool set_topic = 4;
  string description = 5;
  bool set_description = 6;
  uint64 icon_attachment_id = 7;       // 0 clears
  bool set_icon = 8;
  uint64 banner_attachment_id = 9;     // 0 clears
  bool set_banner = 10;
  uint64 parent_id = 11;
  bool set_parent = 12;
  uint32 position = 13;
  bool set_position = 14;
}
message DeleteChannelRequest { uint64 channel_id = 1; }
message OpenDmRequest { uint64 user_id = 1; }

// Group conversations (1.2, capability "dm.group"): 3-10 people who each
// share a server with whoever adds them. Any participant may add people or
// rename it (UpdateChannelRequest.name); the last one to leave deletes it.
message CreateGroupDmRequest {
  repeated uint64 user_ids = 1;  // others; the caller is added implicitly
  string name = 2;               // optional
}
message AddGroupDmRecipientRequest { uint64 channel_id = 1; uint64 user_id = 2; }
message LeaveGroupDmRequest { uint64 channel_id = 1; }

// ---------------------------------------------------------------- messages

message SendMessageRequest {
  uint64 channel_id = 1;
  string content = 2;
  uint64 reply_to = 3;
  bool is_action = 4;
  repeated uint64 attachment_ids = 5;
  bytes operation_id = 7;         // messages.idempotency.v1: stable 16-byte operation ID
  bytes encrypted = 6;            // 1.2 "e2e.v1": direct/group conversations only, content empty
}
message ReadMarker { uint64 channel_id = 1; uint64 message_id = 2; int64 timestamp = 3; }
message SetReadMarkerRequest { uint64 channel_id = 1; uint64 message_id = 2; }

message EditMessageRequest {
  uint64 message_id = 1;
  string content = 2;
  bytes encrypted = 3;
}

// ----------------------------------------------------- end-to-end encryption
//
// 1.2, capability "e2e.v1". Every device holds an X25519 key pair; only the
// public half is published. A message body is sealed with a random content
// key (XChaCha20-Poly1305, associated data = "omachat-e2e-v1" | channel id |
// author id (both 8 bytes big-endian) | 32-byte sender public key), and that key is boxed (crypto_box) from
// the sender's device key to every participant device. The server stores and
// relays the payload without being able to read it. See docs/security.md.

message DeviceKey {
  uint64 user_id = 1;
  bytes public_key = 2;           // 32 bytes
  int64 created_at = 3;
}
message PublishDeviceKeyRequest { bytes public_key = 1; }
message RevokeDeviceKeyRequest { bytes public_key = 1; }
message GetDeviceKeysRequest { repeated uint64 user_ids = 1; }
message DeviceKeyList { repeated DeviceKey keys = 1; }

message E2EKeyWrap {
  bytes recipient_key = 1;        // device public key
  bytes nonce = 2;                // 24 bytes
  bytes box = 3;                  // crypto_box_easy(content key | BLAKE2b-256(nonce | ciphertext))
}
message E2EFile {
  uint64 attachment_id = 1;
  string filename = 2;            // the real name; the server only sees "file.enc"
  string mime_type = 3;
  uint64 size = 4;                // plaintext bytes
  bytes key = 5;                  // crypto_secretstream_xchacha20poly1305 key; header leads the file
}
message E2EBody {
  string content = 1;
  repeated E2EFile files = 2;
}
message E2EPayload {
  uint32 version = 1;             // 1
  bytes sender_key = 2;           // the sending device's public key
  bytes nonce = 3;                // 24 bytes
  bytes ciphertext = 4;           // E2EBody
  repeated E2EKeyWrap wraps = 5;
}
message DeleteMessageRequest { uint64 message_id = 1; }
message GetMessagesRequest {
  uint64 channel_id = 1;
  uint64 before_message_id = 2;   // 0 = newest
  uint32 limit = 3;               // default 50, max 100
}
message MessagePage {
  uint64 channel_id = 1;
  repeated ChatMessage messages = 2;  // newest first
  bool has_more = 3;
}
message SearchMessagesRequest {
  uint64 channel_id = 1;     // 0 with server_id set = every readable channel of that server
  string query = 2;
  uint32 limit = 3;
  uint64 server_id = 4;      // 1.2, capability "search.server"
}
message ReactionRequest {
  uint64 message_id = 1;
  string emoji = 2;
  bool add = 3;
}

// -------------------------------------------------------- custom emoji
//
// Creation reuses an attachment already uploaded via the normal upload flow
// (begin_upload/upload_chunk/finish_upload); this message only registers it
// as a named emoji for the server.
message CreateEmojiRequest {
  uint64 server_id = 1;
  string name = 2;
  uint64 attachment_id = 3;
}
message DeleteEmojiRequest {
  uint64 server_id = 1;
  uint64 emoji_id = 2;
}
message ListEmojiRequest {
  uint64 server_id = 1;
}
message EmojiList {
  uint64 server_id = 1;
  repeated CustomEmoji emoji = 2;
}

// ------------------------------------------------------------- attachments
//
// Files travel over the control connection in chunks of at most
// UploadTicket.chunk_size bytes, so no second port is needed. An upload
// belongs to the connection that began it. If that connection closes before
// FinishUpload, the upload waits (10 minutes idle at most) for the same user
// to ResumeUpload it from another connection (1.2, "attachments.resume").
// A finished attachment stays pending until a SendMessage in the same
// channel references it; pending attachments are purged after an hour.

message BeginUploadRequest {
  uint64 channel_id = 1;
  string filename = 2;
  string mime_type = 3;
  uint64 size = 4;
  bool channel_artwork = 5;            // ManageChannel; also permits voice/category uploads
}
message UploadTicket {
  uint64 attachment_id = 1;
  uint32 chunk_size = 2;          // maximum bytes per UploadChunk
  uint64 received = 3;            // bytes already stored (ResumeUpload); send from here
}
message ResumeUploadRequest { uint64 attachment_id = 1; }
message UploadChunkRequest {
  uint64 attachment_id = 1;
  uint64 offset = 2;              // must equal the bytes received so far
  bytes data = 3;
}
message FinishUploadRequest {
  uint64 attachment_id = 1;
  bytes sha256 = 2;               // optional; verified when present
}
message CancelUploadRequest { uint64 attachment_id = 1; }
message DownloadRequest {
  uint64 attachment_id = 1;
  uint64 offset = 2;
  uint32 length = 3;              // clamped to the server chunk size
}
message FileChunk {
  uint64 attachment_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  uint64 total_size = 4;
}

message TypingRequest { uint64 channel_id = 1; }
message SetPresenceRequest { UserStatus status = 1; }

// ------------------------------------------------------------------- voice

message JoinVoiceRequest {
  uint64 channel_id = 1;
  bool self_mute = 2;
  bool self_deaf = 3;
  bool transfer = 4; // explicit user consent when another session owns voice
}
message LeaveVoiceRequest {}
message SetVoiceStateRequest {
  bool self_mute = 1;
  bool self_deaf = 2;
}
// Screen sharing (1.2, capability "video.h264"). A streamer sends H.264 as
// video packets on its voice media stream; the relay forwards them only to
// members of the same voice channel who asked to watch. See docs/media.md.
message SetStreamingRequest { bool streaming = 1; }
message WatchStreamRequest { uint64 user_id = 1; bool watch = 2; }

message VoiceSession {
  uint64 channel_id = 1;
  uint32 stream_id = 2;          // this client's media stream id
  bytes media_key = 3;           // 32-byte ChaCha20-Poly1305 key, session-scoped
  uint32 udp_port = 4;
  int64 expires_at = 5;          // unix ms; client re-joins before expiry
  uint32 bitrate = 6;            // suggested Opus bitrate (bps)
}

// -------------------------------------------------------------- moderation

message KickRequest { uint64 server_id = 1; uint64 user_id = 2; string reason = 3; }
message BanRequest { uint64 server_id = 1; uint64 user_id = 2; string reason = 3; }
message UnbanRequest { uint64 server_id = 1; uint64 user_id = 2; }
message ServerMuteRequest { uint64 server_id = 1; uint64 user_id = 2; bool mute = 3; bool deaf = 4; }

message CreateRoleRequest {
  uint64 server_id = 1;
  string name = 2;
  uint64 permissions = 3;
  uint32 color = 4;
}
message UpdateRoleRequest {
  uint64 role_id = 1;
  string name = 2;
  uint64 permissions = 3;
  uint32 color = 4;
  uint32 position = 5;
}
message DeleteRoleRequest { uint64 role_id = 1; }
message AssignRoleRequest {
  uint64 server_id = 1;
  uint64 user_id = 2;
  uint64 role_id = 3;
  bool add = 4;
}
message SetOverrideRequest { PermissionOverride override = 1; bool remove = 2; }
message ListOverridesRequest { uint64 channel_id = 1; }
message OverrideList { repeated PermissionOverride overrides = 1; }

// ------------------------------------------------------------------ events

message TypingEvent { uint64 channel_id = 1; uint64 user_id = 2; }
message MessageDeleteEvent { uint64 channel_id = 1; uint64 message_id = 2; }
message ChannelDeleteEvent { uint64 channel_id = 1; uint64 server_id = 2; }
message MemberLeaveEvent { uint64 server_id = 1; uint64 user_id = 2; string reason = 3; }
message ServerDeleteEvent { uint64 server_id = 1; }
message RoleDeleteEvent { uint64 server_id = 1; uint64 role_id = 2; }
message PresenceEvent { uint64 user_id = 1; UserStatus status = 2; }
message ReactionEvent { uint64 channel_id = 1; uint64 message_id = 2; string emoji = 3; uint64 user_id = 4; bool add = 5; }
message EmojiEvent { uint64 server_id = 1; CustomEmoji emoji = 2; bool added = 3; }
message PermissionsChangedEvent { uint64 server_id = 1; }
message DeviceKeysChangedEvent { uint64 user_id = 1; }

message Event {
  uint64 sequence = 1;   // 0 for ephemeral events (typing) that are not replayed
  oneof kind {
    ChatMessage message_create = 10;
    ChatMessage message_update = 11;
    MessageDeleteEvent message_delete = 12;
    Channel channel_create = 13;
    Channel channel_update = 14;
    ChannelDeleteEvent channel_delete = 15;
    Member member_join = 16;
    Member member_update = 17;
    MemberLeaveEvent member_leave = 18;
    PresenceEvent presence_update = 19;
    VoiceState voice_state_update = 20;
    ReactionEvent reaction = 21;
    Role role_update = 22;
    RoleDeleteEvent role_delete = 23;
    TypingEvent typing = 24;
    Server server_create = 25;
    Server server_update = 26;
    ServerDeleteEvent server_delete = 27;
    User user_update = 28;
    PermissionsChangedEvent permissions_changed = 29;
    DeviceKeysChangedEvent device_keys_changed = 30;
    EmojiEvent emoji_changed = 31;
    ReadMarker read_marker = 32;
  }
}

// ---------------------------------------------------------------- envelope

message Ok {}

message Envelope {
  // Client-chosen, echoed in the response. 0 for server-pushed events.
  uint64 request_id = 1;
  Error error = 2;

  oneof payload {
    // handshake/auth
    Hello hello = 10;
    HelloReply hello_reply = 11;
    RegisterRequest register = 12;
    LoginRequest login = 13;
    RefreshRequest refresh = 14;
    ResumeRequest resume = 15;
    LogoutRequest logout = 16;
    DeleteAccountRequest delete_account = 136;
    AuthResult auth_result = 17;
    ResumeResult resume_result = 18;
    Ok ok = 19;
    OAuthLoginRequest oauth_login = 130;
    OAuthLinkRequest oauth_link = 131;
    OAuthUnlinkRequest oauth_unlink = 132;
    ListOAuthIdentitiesRequest list_oauth_identities = 133;
    OAuthIdentityList oauth_identity_list = 134;
    UpdateProfileRequest update_profile = 135;
    ListLoginSessionsRequest list_login_sessions = 159;
    LoginSessionList login_session_list = 160;
    RevokeLoginSessionRequest revoke_login_session = 161;

    // sync
    SyncRequest sync = 20;
    SyncState sync_state = 21;
    InstanceStatusRequest instance_status_request = 150;
    InstanceStatus instance_status = 151;
    SetInstanceRegistrationRequest set_instance_registration = 152;
    DeleteInstanceCommunityRequest delete_instance_community = 153;
    SetInstanceSuspensionRequest set_instance_suspension = 154;
    RestartInstanceRequest restart_instance = 155;
    InstanceModerationRequest instance_moderation = 156;

    // servers / channels
